# M7 — The Zoning Rule Verifier, in One Sitting

This is a compact study guide to **Burnaby_prototype (M7)**: a system that reads zoning rules pulled from municipal bylaw PDFs — minimum lot areas, maximum heights, setbacks, coverage caps, dwelling-unit counts — and decides, with a citation-backed proof, which ones are safe enough to put on a map. An AI *proposes* rules; a deterministic checker *proves* them; only proven rules flow downstream. Everything in this guide is an unpacking of one sentence:

> **Key Idea** Extraction proposes. Verification proves. GIS consumes only verified rules.

Read it top to bottom in about 30 minutes, or jump to a section from the sidebar. Five callout types recur: **Key Idea** (remember this), **Why It Matters** (the stakes), **Watch Out** (a common misread), **War Story** (a real bug we closed), **Try It** (a command to run).

---

## 1. The One Idea: a Trust Boundary

An LLM that reads a bylaw will hand you clean-looking JSON that is sometimes simply wrong — a value that isn't in the text, a min read as a max, a number borrowed from the wrong table column. It sounds just as confident when it's wrong. You cannot put that straight onto a map that gates building permits.

So M7 draws a hard line. On one side, anything may **propose** rules and enrich evidence. On the other side, only plain, auditable code may **decide**. Nothing an LLM says — no confidence score, no "looks fine" flag — can cross that line on its own.

```mermaid
flowchart LR
  subgraph PROPOSE["PROPOSE  (may suggest, never decide)"]
    direction TB
    A["Bylaw PDF"]
    B["Discovery + RAG"]
    C["Matrix + LLM extraction"]
    D["Source repair"]
  end
  PROPOSE -->|"candidates + cited evidence"| GATE
  GATE{{"DETERMINISTIC VERIFIER<br/>the only authority"}}
  GATE -->|"proven"| V["verified"]
  GATE -->|"held / unsafe / out-of-scope"| OTHER["review · rejected · not_used"]
  V --> GIS["GIS map + dashboard<br/>(verified only)"]
  OTHER -. "advisory tools can suggest,<br/>can never promote" .-> GATE
  classDef gate fill:#0969da,stroke:#0a4ea3,color:#fff;
  class GATE gate;
```

> **Why It Matters** A wrong setback isn't a typo — it can approve a building that should be refused. The system's first promise is therefore *never to verify something the bylaw doesn't say*, even at the cost of sending a true-but-unclear rule to a human instead of guessing.

> **Watch Out** "I built an AI that extracts zoning rules" is the wrong framing. The product is the **verifier**; the LLM is a replaceable proposer. If your one-liner makes the model the hero, you've described the wrong system.

---

## 2. What Counts as a Rule

A number alone is not a rule. "10" is meaningless; "maximum height 10 m for a principal building" is a rule, because it carries everything you need to *apply* and *check* it. M7 breaks every rule into the same fixed fields:

| Field | Meaning | Example |
|---|---|---|
| `rule_object` | what is limited | `height`, `setback`, `lot_area` |
| `constraint_type` | direction | `minimum` / `maximum` |
| `operator` | the comparison it implies | `>=` / `<=` |
| `value` + `unit` | the quantity | `70` · `%` |
| `constraint_scope` | what the value measures | `impervious_surface` |
| `applies_to` | which thing it governs | `rowhouse lots` |
| `condition` | when it holds | `heritage lots` |

The verifier never sees loose fields. Every proposer — the matrix extractor, the LLM, the legacy lanes — is normalized into **two records**:

- a **`rule_candidate`** = the *claim* ("here is the rule I think exists"), and
- an **`evidence_unit`** = the *exhibit* (the exact bylaw text it points at).

They're joined by one `evidence_id`. The verifier asks, field by field: *is this claim actually visible in that exhibit?*

```json
// candidate (a claim)                evidence_unit (the exhibit it cites)
{ "rule_object": "impervious_surface",  { "evidence_id": "...ev_002",
  "operator": "<=", "value": "70",        "page": 6,
  "unit": "%", "condition": "heritage lots",  "evidence_text":
  "evidence_id": "...ev_002" }                "impervious surface area up to 70%" }
```

> **Key Idea** One claim, one cited exhibit, checked field by field. That structure is what turns "verification" from a vibe into a mechanical yes/no — and it's why three different extractors can feed one verifier.

---

## 3. The M7 Pipeline

M7 is one path. A bylaw PDF is scoped to the right district, swept for every rule-like clause, extracted two ways, repaired, then handed to the verifier. Two extractors run side by side:

- **Matrix extractor (deterministic).** Most dwelling rules live in dimensional tables. M7 reads the table *geometry* and emits one candidate per cell — no LLM guessing. On Burnaby this path produces the large majority of verified rules, and each cell carries its own proof.
- **LLM extractor (prose).** For sentences ("the maximum building height is 11.0 metres"), `google/gemini-3.1-flash-lite` proposes structured candidates at temperature 0. It is *only* a proposer; its system prompt literally says it may not decide whether a rule is correct.

```mermaid
flowchart LR
  PDF["Bylaw PDF"] --> SCOPE["Page-scope<br/>(district pages only)"]
  SCOPE --> DISC["Discovery sweep<br/>+ RAG packs"]
  DISC --> MX["Matrix extractor<br/>(deterministic cells)"]
  DISC --> LLM["LLM extractor<br/>(prose · gemini-3.1)"]
  MX --> REP["Source repair<br/>(re-anchor to real page)"]
  LLM --> REP
  REP --> VER{{"Verifier"}}
  VER --> V["verified"] --> GIS["GIS contract + map"]
  VER --> R["review · rejected · not_used"]
```

**Page-scoping** is an M7 fix worth calling out: Calgary's bylaw is 1,053 pages, but only the R-CG district pages matter. M7 now reads provenance and ingests just those pages, so discovery isn't drowning in the whole book.

> **War Story** Before M7, the product pipeline ignored `provenance.pages` and swept Calgary's *entire* 1,053-page bylaw — burying the R-CG rules in noise. Fixing it (and adding the page span to the cache key) is what let Calgary's recall climb from 0.84 to 1.0. The verifier never changed; the *input* got honest.

> **Watch Out** Don't confuse "discovery found it" with "it verified." Discovery is tuned for recall (collect everything plausible); the verifier is tuned for precision (promote only the proven). Mixing those two jobs is exactly how false-verifies are born.

---

## 4. The Verifier: How a Rule Is Proved

The verifier runs a handful of narrow, deterministic checks against the cited evidence and records each failure as a named **support gap**. Then one tiny function turns the gap set into a decision. There is no confidence score anywhere in it.

```python
def verification_decision_from_gaps(support_gaps):
    blocking = set(support_gaps) - ADVISORY_GAPS   # upstream "please review" never blocks
    if not blocking:                       return VERIFIED      # every gate passed
    if CRITICAL_REJECTION_GAPS & blocking: return REJECTED      # value/unit absent or contradicted
    if NOT_USED_GAPS & blocking:           return NOT_USED      # real, but outside the contract
    return REVIEW_NEEDED                                        # plausible but unproven
```

Read it slowly: a rule is **verified only when the blocking-gap set is empty**. Every other branch is a *kind of not-promoted*. The checks the gaps come from:

- **value** — the number is visible by *digit-boundary* matching, so `5` is never satisfied by `7.5` or `50`.
- **unit** — present, and *compatible* with the family (a height can never be measured in `%`).
- **operator** — the direction wording is actually there ("up to" -> `<=`); default-closed, so an unknown operator fails rather than passes.
- **scope / applies_to** — the qualifier is grounded near the value, not borrowed from a neighbour.

```mermaid
flowchart TD
  G["support gaps"] --> B{"any blocking gap?"}
  B -- "none" --> V["VERIFIED → GIS"]
  B -- "critical<br/>(value/unit absent, wrong column,<br/>refuted operator)" --> X["REJECTED"]
  B -- "out-of-contract<br/>(cross-ref, definition,<br/>off-target section)" --> N["NOT_USED"]
  B -- "anything else<br/>(scope/operator/condition<br/>not recognized)" --> R["REVIEW_NEEDED"]
  classDef v fill:#e9f7ec,stroke:#1a7f37;classDef x fill:#ffebe9,stroke:#cf222e;
  classDef n fill:#eef1f4,stroke:#6e7781;classDef r fill:#fdf3df,stroke:#9a6700;
  class V v;class X x;class N n;class R r;
```

> **Key Idea** The tiering is a safety argument. A *missing value* means the citation itself is wrong — no context can fix it, so it's a hard **reject**. A *missing scope cue* usually means "wording not recognized" — a human or better evidence can repair it, so it's **review**. Severity tracks how certain the failure is, not how bad it sounds.

> **Watch Out** "The model returned `review_required: false`, so it's safe." No. That's an *advisory* label — it's subtracted out before the decision. Only an empty blocking-gap set promotes a rule.

---

## 5. The Four Buckets

Every candidate lands in exactly one bucket. Only the green one reaches the map.

<div class="legend"><span class="lg-v">verified → GIS</span><span class="lg-r">review_needed</span><span class="lg-x">rejected</span><span class="lg-n">not_used</span></div>

| Bucket | Meaning | To GIS? |
|---|---|---|
| **verified** | every required claim proven against the citation | ✅ yes |
| **review_needed** | plausible but incomplete / ambiguous / conditional — a human can repair | no |
| **rejected** | a contradiction or unsafe-malformed candidate (value absent, wrong column, inverted operator) | no |
| **not_used** | a real artifact outside today's contract (a cross-reference, a definition, an off-target section) — kept for audit | no |

> **Watch Out** `rejected` ≠ `not_used`. *Rejected* says "this citation is wrong." *Not_used* says "this is a real bylaw fact, just outside what this run is contracted to verify." Calgary's `not_used` items are genuine rules from sections we don't target — parked for audit, never an error and never an output.

> **Why It Matters** A `not_used` bucket is exactly what lets precision stay 1.0 *honestly*. Without it, the verifier would either reject real out-of-scope rules (overclaiming "wrong") or quietly verify them (a false-verify). Routing them aside does neither.

---

## 6. Why It's Safe — and Where the Limit Is

The headline guarantee: across all three cities, **zero false-verified rules**, precision 1.0, and the adversarial suite fully blocked. That's not luck — it's a set of *shape gates* that catch candidates whose individual fields all look fine but whose **shape** betrays them. Each gate was born from a real leak.

| Leak (looks verifiable) | What's wrong | Bucket |
|---|---|---|
| `floor_area <= 0.25 m²` from "0.25 multiplied by the site area" | 0.25 is a *ratio coefficient*, not a cap | review |
| `dwelling_units <= 3` from "1 to 3 units; 4 to 6 units" | grabbed the low band; real max is 6 | review |
| `lot_coverage 55%` for the 5–6 unit column whose cell says 45% | wrong column | **reject** |
| `135 degrees` read as a dwelling-unit count | value glued to a foreign unit | **reject** |
| `1.2 m setback` from "…a 1.2 m private maintenance easement" | the 1.2 m is the *easement width*; the setback is zero | review |

> **War Story** That last row is an M7 find. A ground-truth pass — reading the *actual* Calgary PDF, not just our own answer key — caught a rule that read §539(4)'s "1.2 m private maintenance easement" as a 1.2 m side setback (the clause actually grants a *zero* setback). The gold benchmark missed it because 1.2 m happens to match a real side-setback value; only the PDF caught it. We added a deterministic "value glued to easement → hold" gate and pinned it.

> **War Story** We also *tried* to raise recall by auto-promoting confident single-source LLM candidates, and **reverted it** — it injected real false-verifies (a count read from a range, a separation read from a height clause). The lesson stuck: the verifier is at its **safe recall ceiling**. You raise recall with *better extraction*, never a *looser verifier*.

> **Key Idea** Every safety gate is *additive*: it can only ever move a rule toward more review, never toward verified (which requires an empty blocking-gap set). So a buggy gate's worst case is over-reviewing a true rule — a cost in human time, never a wrong rule on the map.

---

## 7. M7 Results & What Changed

M7 is the generational rebuild over pre-M7: one consolidated, matrix-aware pipeline on a single model (`gemini-3.1-flash-lite`), the page-scope fix, a full rename to the M7 generation (`outputs/m7_runs`, `m7_measure`), a reranked chatbot, and a ground-truth-audited safety pass.

| City | Candidates | Verified | Review | Rejected | Not&nbsp;used | Precision | False&nbsp;verified |
|---|--:|--:|--:|--:|--:|--:|--:|
| Burnaby R1 | 144 | 87 | 57 | 0 | 0 | 1.00 | 0 |
| Calgary R-CG | 150 | 29 | 42 | 27 | 52 | 1.00 | 0 |
| Vancouver RS | 56 | 10 | 31 | 15 | 0 | 1.00 | 0 |

What moved from pre-M7: **Calgary 16 → 29 verified, recall 0.84 → 1.0**; **Burnaby 84 → 87, recall → 0.97**; Vancouver recall 1.0. Every gain came from *extraction* (matrix candidates + page-scoping + the stronger prose model), with the verifier held strictly — **485 tests green**, adversarial **ALL BLOCKED**.

> **Watch Out** Read "zero false-verified" precisely. It means: on the benchmarked, in-contract lanes, nothing wrong was promoted. It does **not** mean every rule in every bylaw was extracted. "Recall" here is *verified-or-review against a curated in-contract gold set*, not full-bylaw completeness. Overstating it is the single most damaging misframing.

---

## 8. Run It & Explore It

Everything runs from `Burnaby_prototype/` with the project venv. The proposer half is dry-runnable with no LLM cost.

```bash
# 1. Extract + verify a city through the matrix-aware pipeline (writes outputs/m7_runs/<city>/<model>/)
.venv/bin/python scripts/run_m7_bakeoff.py --city calgary_rcg --models google/gemini-3.1-flash-lite

# 2. Safety gates (offline, no API key)
.venv/bin/python -m pytest -q
.venv/bin/python benchmark/evaluate_adversarial.py --config configs/calgary_rcg.json \
    --cases benchmark/gold/calgary_rcg_adversarial_cases.json

# 3. Score against the curated gold set
.venv/bin/python benchmark/evaluate_benchmark.py --city calgary_rcg

# 4. Explore: the 4-tab dashboard + the grounded, cited chatbot
.venv/bin/python -m streamlit run dashboard/streamlit_app.py --server.port 8501
```

> **Try It** Build Calgary's discovery packs with **no model call and no cost** by adding `--dry-run` to step 1 — then open the run's `discovery_audit.json` to see exactly what the proposer found before a token is spent.

The **dashboard** is read-only: it renders committed JSON (counts, proof traces, the review queue, GIS handoff) and every count drills down to the exact rules behind it. The **chatbot** ("Ask the Bylaw") retrieves real bylaw sections (BM25 + cross-encoder rerank) and answers with citations — and it can never verify, approve, or change a rule.

---

## 9. Quick Reference

**The sentence:** Extraction proposes · Verification proves · GIS consumes only verified rules.

**The contract:** every lane → `rule_candidate` (claim) + `evidence_unit` (exhibit), joined by `evidence_id`.

**The decision:** `verified` iff the blocking-gap set is empty; else `rejected` (critical) > `not_used` (out-of-contract) > `review_needed`.

**The gap tiers:** 7 critical (reject) · 5 not-used · the rest review.

**The safety contract (never weakens):** precision 1.0 · false_verified 0 · source-support failures 0 · adversarial ALL BLOCKED · full pytest green.

**Key files:** `verification.py` (the gate) · `decision_policy.py` (gaps → bucket) · `support_checks.py` (the field checks) · `table_natural_logic.py` + `m7_matrix_candidates.py` (tables) · `native_extraction.py` (LLM proposer) · `slim_pipeline.py` (orchestration + GIS contract).

**Three honest reminders:** recall is in-contract, not full-bylaw · the verifier never reads the answer key · advisory tools can suggest but never promote.

> **Key Idea** If you can re-derive every box in this guide from the one sentence at the top, you understand M7. Everything else is detail in service of keeping that sentence true under pressure.

  // heading ids + TOC + anchors
  var used = {};
  function slug(t){ var b=t.toLowerCase().trim().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')||'s'; if(used[b]!=null){used[b]++;return b+'-'+used[b];} used[b]=0; return b; }
  var toc=document.getElementById('toc'), lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent='On this page';
  var ul=document.createElement('ul'); toc.appendChild(lbl); toc.appendChild(ul);
  var heads=container.querySelectorAll('h1, h2'), links={};
  heads.forEach(function(h){
    if(!h.id) h.id=slug(h.textContent);
    var a=document.createElement('a'); a.className='anchor'; a.href='#'+h.id; a.textContent='#'; h.appendChild(a);
    var li=document.createElement('li'); li.className=h.tagName.toLowerCase();
    var link=document.createElement('a'); link.href='#'+h.id;
    link.textContent=(h.childNodes[0]?h.childNodes[0].textContent:h.textContent).replace(/#$/,'').trim();
    li.appendChild(link); ul.appendChild(li); links[h.id]=link;
  });

  // callouts
  var map={'Key Idea':'key','Why It Matters':'why','Watch Out':'mistake','War Story':'war','Try It':'try'};
  container.querySelectorAll('blockquote').forEach(function(bq){
    var s=bq.querySelector('strong'); if(!s) return;
    var k=map[s.textContent.trim()]; if(k) bq.classList.add('callout','c-'+k);
  });

  // mermaid render
  if(window.mermaid){
    try{
      mermaid.initialize({startOnLoad:false,theme:'default',securityLevel:'loose',flowchart:{useMaxWidth:true,htmlLabels:true}});
      if(mermaid.run){ mermaid.run({querySelector:'.mermaid'}); }
      else if(mermaid.init){ mermaid.init(undefined, container.querySelectorAll('.mermaid')); }
    }catch(e){}
  }

  // scrollspy
  var spy=new IntersectionObserver(function(es){
    es.forEach(function(en){ var l=links[en.target.id]; if(!l) return;
      if(en.isIntersecting){ Object.keys(links).forEach(function(k){links[k].classList.remove('active');}); l.classList.add('active'); l.scrollIntoView({block:'nearest'}); }});
  },{rootMargin:'-64px 0px -75% 0px',threshold:0});
  heads.forEach(function(h){ spy.observe(h); });

  // ui
  var sb=document.getElementById('sidebar');
  document.getElementById('menuToggle').addEventListener('click',function(){ sb.classList.toggle('open'); });
  ul.addEventListener('click',function(){ if(window.innerWidth<=980) sb.classList.remove('open'); });
  document.getElementById('printBtn').addEventListener('click',function(){ window.print(); });
  var tt=document.getElementById('toTop');
  tt.addEventListener('click',function(){ window.scrollTo({top:0,behavior:'smooth'}); });
  window.addEventListener('scroll',function(){ tt.style.display=window.scrollY>600?'block':'none'; });
})();
</script>
</body>
</html>
